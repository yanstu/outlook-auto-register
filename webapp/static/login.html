<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · 信匣台</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/static/assets/favicon-192.png" />
<link rel="apple-touch-icon" href="/static/assets/apple-touch-icon.png" />
<style>
  :root {
    --bg:#f5f4f1; --bg-card:#fff; --bg-muted:#f0efe9;
    --border:#e4e2dc; --border-strong:#d4d1c8;
    --fg:#1a1a22; --fg-2:#3a3a48; --fg-3:#6b6b78; --fg-4:#9a9aa6;
    --brand:#2E3A8C; --brand-hover:#243074; --brand-ring:rgba(46,58,140,.16);
    --accent:#C17F59;
    --danger:#b91c1c; --danger-bg:#fef2f2; --danger-border:#fecaca;
    --grid-line:rgba(46,58,140,.045);
    --r:8px; --r-sm:6px; --r-lg:14px;
    --shadow-lg:0 16px 40px rgba(46,58,140,.12),0 2px 6px rgba(26,26,34,.05);
    --ease-out:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.42,.5,1);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",system-ui,sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  button,input { font:inherit; outline:none; }
  ::placeholder { color:var(--fg-4); }
  :focus-visible { outline:2px solid var(--brand); outline-offset:2px; }

  /* 与控制台同一套底纹：细网格 + 极淡织纹 + 品牌色晕开 */
  body::before, body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:0; }
  body::before {
    background-image:
      linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    background-size:28px 28px;
    -webkit-mask-image:radial-gradient(80% 70% at 50% 42%, #000 0%, rgba(0,0,0,.35) 58%, transparent 100%);
    mask-image:radial-gradient(80% 70% at 50% 42%, #000 0%, rgba(0,0,0,.35) 58%, transparent 100%); }
  body::after {
    opacity:.85;
    background-image:
      radial-gradient(58% 40% at 50% 4%, rgba(46,58,140,.11), transparent 68%),
      radial-gradient(42% 36% at 88% 92%, rgba(193,127,89,.10), transparent 70%),
      radial-gradient(36% 30% at 8% 88%, rgba(46,58,140,.06), transparent 72%),
      repeating-linear-gradient(45deg, rgba(46,58,140,.018) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(-45deg, rgba(193,127,89,.014) 0 1px, transparent 1px 3px); }

  .wrap { position:relative; z-index:1; min-height:100%; display:grid; place-items:center; padding:24px; }
  .card { width:100%; max-width:352px; background:var(--bg-card); border:1px solid var(--border);
    border-radius:var(--r-lg); box-shadow:var(--shadow-lg); padding:28px 26px 24px;
    animation:cardIn .46s var(--ease-spring) both; }
  @keyframes cardIn { from { opacity:0; transform:scale(.95) translateY(14px); } to { opacity:1; transform:none; } }
  .brand { display:flex; align-items:center; gap:11px; margin-bottom:22px; }
  .logo { width:34px; height:34px; border-radius:10px; object-fit:cover; display:block;
    box-shadow:0 2px 8px rgba(46,58,140,.22); }
  .name { font-weight:650; font-size:15px; line-height:1.15; letter-spacing:-.01em; }

  label { display:block; font-size:12.5px; font-weight:600; color:var(--fg-2); margin-bottom:7px; }
  input { width:100%; height:40px; padding:0 12px; border:1px solid var(--border-strong);
    border-radius:var(--r); background:var(--bg-card); color:var(--fg);
    transition:border-color .16s ease, box-shadow .16s ease; }
  input:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-ring); }
  .btn { width:100%; height:40px; margin-top:16px; border:1px solid var(--brand); border-radius:var(--r);
    background:var(--brand); color:#fff; font-size:13.5px; font-weight:600; cursor:pointer;
    box-shadow:0 1px 2px rgba(46,58,140,.28), inset 0 1px 0 rgba(255,255,255,.14);
    transition:background .16s ease, transform .12s ease; }
  .btn:hover:not(:disabled) { background:var(--brand-hover); }
  .btn:active:not(:disabled) { transform:translateY(1px); }
  .btn:disabled { opacity:.6; cursor:not-allowed; }
  .err { display:none; margin-top:14px; padding:9px 11px; font-size:12.5px; line-height:1.5;
    color:var(--danger); background:var(--danger-bg); border:1px solid var(--danger-border); border-radius:var(--r-sm); }
  .err.show { display:block; animation:errIn .3s var(--ease-out) both; }
  @keyframes errIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="form" autocomplete="off">
    <div class="brand">
      <img class="logo" src="/static/assets/logo.png" alt="信匣台" width="34" height="34" />
      <div class="name">信匣台</div>
    </div>
    <label for="pw">口令</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus />
    <button class="btn" id="submit" type="submit">进入控制台</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
const form = document.getElementById('form');
const pw = document.getElementById('pw');
const submit = document.getElementById('submit');
const err = document.getElementById('err');

function nextUrl(){
  const raw = new URLSearchParams(location.search).get('next') || '/';
  // 只允许站内相对路径，避免被 ?next= 带去外站
  return (raw.startsWith('/') && !raw.startsWith('//')) ? raw : '/';
}

function fail(msg){ err.textContent = msg; err.classList.add('show'); }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.remove('show');
  submit.disabled = true;
  submit.textContent = '登录中…';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw.value }),
    });
    if (r.ok) { location.replace(nextUrl()); return; }
    const data = await r.json().catch(() => ({}));
    fail(data.error || '口令错误');
  } catch (_) {
    fail('网络异常，请重试');
  }
  submit.disabled = false;
  submit.textContent = '进入控制台';
  pw.select();
});
</script>
</body>
</html>
