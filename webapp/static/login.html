<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · Outlook 注册控制台</title>
<style>
  :root {
    --bg:#fafafa; --bg-card:#fff; --bg-muted:#f4f4f5;
    --border:#eaeaec; --border-strong:#d4d4d8;
    --fg:#18181b; --fg-2:#3f3f46; --fg-3:#71717a; --fg-4:#a1a1aa;
    --brand:#059669; --brand-hover:#047857; --brand-ring:rgba(5,150,105,.15);
    --danger:#b91c1c; --danger-bg:#fef2f2; --danger-border:#fecaca;
    --r:8px; --r-sm:6px; --r-lg:12px;
    --shadow-lg:0 12px 32px rgba(15,15,15,.10);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased; }
  button,input { font:inherit; outline:none; }
  ::placeholder { color:var(--fg-4); }

  .wrap { min-height:100%; display:grid; place-items:center; padding:24px; }
  .card { width:100%; max-width:360px; background:var(--bg-card); border:1px solid var(--border);
    border-radius:var(--r-lg); box-shadow:var(--shadow-lg); padding:28px 26px 24px; }
  .brand { display:flex; align-items:center; gap:11px; margin-bottom:22px; }
  .logo { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#10b981,#059669);
    color:#fff; display:grid; place-items:center; font-weight:700; font-size:14px;
    box-shadow:0 1px 2px rgba(5,150,105,.25); }
  .name { font-weight:650; font-size:15px; line-height:1.15; }
  .name small { display:block; font-weight:400; font-size:11.5px; color:var(--fg-3); margin-top:3px; }

  label { display:block; font-size:12.5px; font-weight:600; color:var(--fg-2); margin-bottom:7px; }
  input { width:100%; height:38px; padding:0 11px; border:1px solid var(--border-strong);
    border-radius:var(--r-sm); background:var(--bg-card); color:var(--fg); }
  input:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-ring); }
  .btn { width:100%; height:38px; margin-top:16px; border:1px solid var(--brand); border-radius:var(--r-sm);
    background:var(--brand); color:#fff; font-size:13.5px; font-weight:600; cursor:pointer;
    box-shadow:0 1px 2px rgba(5,150,105,.25); }
  .btn:hover:not(:disabled) { background:var(--brand-hover); }
  .btn:disabled { opacity:.6; cursor:not-allowed; }
  .err { display:none; margin-top:14px; padding:9px 11px; font-size:12.5px; line-height:1.5;
    color:var(--danger); background:var(--danger-bg); border:1px solid var(--danger-border); border-radius:var(--r-sm); }
  .err.show { display:block; }
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="form" autocomplete="off">
    <div class="brand">
      <div class="logo">OL</div>
      <div class="name">Outlook 注册控制台<small>请输入口令继续</small></div>
    </div>
    <label for="pw">口令</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus />
    <button class="btn" id="submit" type="submit">进入控制台</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
const form = document.getElementById('form');
const pw = document.getElementById('pw');
const submit = document.getElementById('submit');
const err = document.getElementById('err');

function nextUrl(){
  const raw = new URLSearchParams(location.search).get('next') || '/';
  // 只允许站内相对路径，避免被 ?next= 带去外站
  return (raw.startsWith('/') && !raw.startsWith('//')) ? raw : '/';
}

function fail(msg){ err.textContent = msg; err.classList.add('show'); }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.remove('show');
  submit.disabled = true;
  submit.textContent = '登录中…';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw.value }),
    });
    if (r.ok) { location.replace(nextUrl()); return; }
    const data = await r.json().catch(() => ({}));
    fail(data.error || '口令错误');
  } catch (_) {
    fail('网络异常，请重试');
  }
  submit.disabled = false;
  submit.textContent = '进入控制台';
  pw.select();
});
</script>
</body>
</html>
