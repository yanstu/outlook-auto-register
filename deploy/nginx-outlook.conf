# /etc/nginx/sites-available/outlook.coolhs.com
# certbot: certbot certonly --webroot -w /var/www/certbot -d outlook.coolhs.com
#
# 反代 Outlook 注册控制台（uvicorn 监听 127.0.0.1:8890）。
# 浏览器走 /login.html + httponly 会话 cookie，curl/脚本走 X-Console-Password 头，
# 其他项目调 Mailbox API 走 Authorization: Bearer mbx_sk —— 口令、会话 cookie 和
# key 都不能在明文 HTTP 上裸奔，所以整站强制 HTTPS。

server {
    listen 80;
    listen [::]:80;
    server_name outlook.coolhs.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name outlook.coolhs.com;

    ssl_certificate     /etc/letsencrypt/live/outlook.coolhs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/outlook.coolhs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 账号 / 代理批量导入的请求体可能很长
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mailbox API（/api/v1）全靠 Authorization 认人，丢了这个头所有调用方都是 401
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        # 运维台的口令头（连字符命名，nginx 默认不会丢，写出来是为了不被后人误删）
        proxy_set_header X-Console-Password $http_x_console_password;
        proxy_set_header Connection "";
        # 注册进度是 SSE（/api/jobs/{id}/events），取码是最长 60s 的长轮询：
        # 一旦开缓冲，前者会攒着不发，后者会被默认 60s 读超时切断。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
